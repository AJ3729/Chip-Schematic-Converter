# schematic2netlist — canonical configuration.
# Every value here was previously a hardcoded magic number in the legacy
# scripts (nodes_mapping_and_netlist.py = "v1", nodes_mapping_and_netlist2.py
# = "v2", scripts/preprocess.py). Where the two legacy variants disagreed the
# v1 value is the default and the v2 value is noted — these are the ablation
# axes of Phase E.

seed: 0

preprocess:
  target_size: 512          # output canvas (px), aspect ratio preserved
  blur_kernel: 3            # Gaussian blur before Otsu for angle estimation
  angle_min_blob_area: 200  # ignore specks when estimating skew angle
  border_margin: 2          # blobs touching the frame within this margin are ignored
  landscape_ratio: 1.05     # rotate 90° CCW if height > width * ratio
  shadow_std_threshold: 18  # only shadow-normalize if gray.std() exceeds this
  shadow_dilate_kernel: 7
  shadow_median_blur: 21
  # Speck removal (gentler than the legacy area-only rule, which deleted
  # faint components): a blob survives if its area OR its extent is
  # meaningful, so hairline wire segments are preserved. Speck removal
  # affects emitted pixels only — never the crop rectangle.
  remove_specks: true
  speck_min_area: 40        # was 120 — deleted real ink
  speck_min_extent: 12      # keep thin/elongated strokes regardless of area
  crop_pad: 12              # minimum padding around the content crop (px)
  crop_pad_frac: 0.02       # ...scaled to image size (12 px is 0.6% of 2000 px)
  # Skew estimation: length-weighted median of Hough segments folded
  # mod 90 (robust), falling back to pooled-blob minAreaRect.
  hough_min_line_frac: 0.06
  hough_threshold: 80
  hough_max_gap: 6
  max_skew_deg: 20.0        # reject implausible skew estimates

detect:
  backend: ultralytics
  cache_dir: data/detections
  model_id: electrical-components-qpl1s/6   # Roboflow hosted model (legacy)
  api_url: https://detect.roboflow.com
  weights: /Users/junaidahmed/Documents/Chip-Schematic-Converter/experiments/train_all/runs/yolov8s_640_seed0/weights/best.pt
  confidence: 0.4           # detector confidence threshold
  image_size: 640           # inference resolution (ultralytics backend)

textmask:
  enabled: true
  adaptive_block_size: 31
  adaptive_c: 10
  dilate_kernel: 3
  min_area: 20
  max_area: 2500
  min_aspect: 0.2
  max_aspect: 6.0
  max_height: 50
  max_width: 120

wires:
  # C2: wire extraction method.
  #   "ink"   — binarized ink (solid strokes) + anisotropic gap bridging
  #   "canny" — legacy edge detection (hollow double-edges); the baseline
  method: ink
  bridge_span: 9            # px, along-stroke gap bridging (anisotropic)
  min_blob_extent: 15       # keep thin strokes regardless of area
  component_mask_pad: 8     # px added around detected component boxes
  canny_low: 40
  canny_high: 120
  morph_kernel: 2           # dilate + open structuring element (px)
  min_blob_area: 20         # v1 = 20, v2 = 60 (ablation E3)
  non_wire_classes:         # detector classes masked out before wire extraction
    # (canonical vocabulary; legacy names canonicalize on load.
    #  Wire Crossover is deliberately absent — masking it would sever
    #  the wires that cross there.)
    - Resistor
    - Capacitor
    - Inductor
    - Diode
    - Zener Diode
    - GND
    - V-DC
    - V-DC (one port)
    - V-AC
    - I-DC
    - I-AC
    - MOSFET-N
    - MOSFET-P
    - BJT-NPN
    - BJT-PNP
    - Op-Amp

nodes:
  connectivity: 8           # 4 or 8 (ablation E4)
  handle_crossovers: false  # crossover-aware net assembly (C2 ablation:
                            # false = classical CC; true = notch + reconnect
                            # opposite arms at detected Wire Crossover boxes)

snapping:
  strategy: boundary       # boundary (C2, default) | directional (v1) | uniform (v2)
  max_expand: 30            # v1 = 30, v2 = 22
  window_depth: 4           # px the snap window reaches into the bbox
  expand_step: 2            # growth step for expanding searches
  ground_max_expand: 40     # v1 ground symbol search radius
  uniform_ground_max_expand: 26   # v2 ground search radius

netlist:
  ground_fallback: most_connected  # most_connected (v1) | fail (v2) — ablation E4
  placeholders:             # values assigned in lieu of OCR
    resistor: 1k
    capacitor: 1u
    inductor: 1m
    dc_supply: DC 5
    ac_supply: AC 1
    dc_current: DC 1m
    ac_current: AC 1m
    diode_model: Ddefault
    zener_model: Zdefault
    mosfet_model: NMOS

simulate:
  ngspice_binary: ngspice
  timeout_s: 5
  diagnostics: true         # parse which node/element ngspice reported failing

# M4 design-intent completion & transparent repair (contribution C5).
# Repair NEVER changes the recovered topology — it only adds explicit,
# logged constraints to make the circuit DC-solvable. See repair.py.
repair:
  enabled: true
  max_assumptions: 8        # minimality budget (flagged if exceeded)
  prefer_spice_aids: true   # prefer SPICE aids over structural edits
  shunt_r: 1e9              # ohms, shunt-to-ground for floating subnets
  strategies:
    add_ground_reference: true
    shunt_floating_net: true
    inductor_series_r: true
    placeholder_values: true
    current_direction: true
